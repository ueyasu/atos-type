    <rect x="242" y="394" width="46" height="40"/><rect x="348" y="394" width="46" height="40"/>
    <rect x="454" y="394" width="46" height="40"/><rect x="560" y="394" width="46" height="40"/>
    <rect x="666" y="394" width="46" height="40"/><rect x="772" y="394" width="46" height="40"/>
    <rect x="878" y="394" width="46" height="40"/>
  </g>
  <rect y="428" width="960" height="10" fill="#4a4353"/>
